<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- Ícone da aba do navegador: Login + Rastreio -->
    <link
        rel="icon"
        type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b5ed7'/%3E%3Crect x='13' y='18' width='74' height='64' rx='9' fill='white'/%3E%3Ccircle cx='34' cy='39' r='10' fill='%230b5ed7'/%3E%3Cpath d='M20 58c0-8 6-13 14-13s14 5 14 13' fill='%230b5ed7'/%3E%3Crect x='55' y='31' width='21' height='5' rx='2.5' fill='%230b5ed7'/%3E%3Crect x='55' y='42' width='16' height='5' rx='2.5' fill='%230b5ed7' opacity='.65'/%3E%3Cpath d='M63 65c0-7 6-13 13-13s13 6 13 13c0 8-13 20-13 20S63 73 63 65z' fill='%230b5ed7'/%3E%3Ccircle cx='76' cy='64' r='4' fill='white'/%3E%3C/svg%3E"
    >

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login</title>

    <link rel="stylesheet" href="tela_login.css">

</head>

<body>

<div class="login-frame">

    <!-- Moldura azul -->
    <div class="moldura moldura-azul"></div>

    <!-- Moldura bordô -->
    <div class="moldura moldura-bordo"></div>


    <!-- ================= LOGIN ================= -->

    <section id="loginVendedor" class="box-busca">

        <header class="topo">
    <img
        id="logoMarca"
        src="Imagens/Logo - Grupo 4k - Branco.png"
        class="logo"
        alt="Grupo 4K"
    >
</header>

<form id="formLogin">

    <div class="input-group">
        <input id="usuarioLogin" type="text" required>
        <label for="usuarioLogin">Usuário Protheus</label>
    </div>

<div class="input-group senha-group">

    <input
        id="senhaLogin"
        type="password"
        required
    >

    <label for="senhaLogin">
        Senha
    </label>

    <button
        type="button"
        class="toggle-senha"
        id="toggleSenha"
        aria-label="Mostrar senha"
    >

        <!-- OLHO ABERTO -->
        <svg
            id="iconEye"
            viewBox="0 0 24 24"
            width="21"
            height="21"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
        >
            <path
                d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
            />

            <circle
                cx="12"
                cy="12"
                r="2.8"
                stroke="currentColor"
                stroke-width="1.8"
            />
        </svg>


        <!-- OLHO FECHADO -->
        <svg
            id="iconEyeOff"
            viewBox="0 0 24 24"
            width="21"
            height="21"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            style="display:none;"
        >
            <path
                d="M3 3l18 18"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
            />

            <path
                d="M10.6 6.2C11.05 6.07 11.52 6 12 6c6.5 0 10 6 10 6a17.8 17.8 0 0 1-3.1 3.5"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
            />

            <path
                d="M6.1 6.9C3.4 8.8 2 12 2 12s3.5 6 10 6c1.25 0 2.4-.23 3.45-.62"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
            />
        </svg>

    </button>

</div>

    <button
        id="btnEntrarLogin"
        type="submit"
    >
        Entrar
    </button>
        <label class="manter-conectado">
        <input
            type="checkbox"
            id="manterConectado"
        >
        <span>Mantenha-me conectado</span>
    </label>

    <div id="erroLogin"></div>

    <button
        type="button"
        id="btnCriarConta"
        class="btn-criar-conta"
    >
        Criar nova conta
    </button>

</form>


<!-- =========================================================
     TELA INTERNA DE CADASTRO
     ========================================================= -->

<div id="areaCadastro">

    <div class="cadastro-conteudo">

        <div class="cadastro-topo">

            <span class="cadastro-icone">+</span>

            <div>
                <h4>Criar nova conta</h4>

                <p>
                    Cadastre seu acesso utilizando
                    seu usuário do Protheus.
                </p>
            </div>

        </div>


        <!-- ==============================
             ETAPA 1
             ============================== -->

        <div id="etapaCadastro1">

            <div class="input-group">

                <input
                    id="cadastroUsuario"
                    type="text"
                    autocomplete="username"
                >

                <label for="cadastroUsuario">
                    Usuário Protheus
                </label>

            </div>


            <div class="input-group">

                <input
                    id="cadastroSenha"
                    type="password"
                    autocomplete="current-password"
                >

                <label for="cadastroSenha">
                    Senha Protheus
                </label>

            </div>


            <button
                type="button"
                id="btnValidarCadastro"
            >
                Continuar
            </button>

        </div>


        <!-- ==============================
     ETAPA 2
     ============================== -->

<div
    id="etapaCadastro2"
    style="display:none;"
>

    <div class="cadastro-sucesso">

        <span>✓</span>

        <div>
            <strong>Usuário validado</strong>

            <small>
                Agora complete seus dados de cadastro.
            </small>
        </div>

    </div>


    <!-- ==============================
         NOME COMPLETO
         ============================== -->

    <div class="input-group">

        <input
            id="cadastroNomeCompleto"
            type="text"
            autocomplete="name"
            maxlength="150"
        >

        <label for="cadastroNomeCompleto">
            Nome Completo
        </label>

    </div>


    <!-- ==============================
         E-MAIL
         ============================== -->

    <div class="input-group">

        <input
            id="cadastroEmail"
            type="email"
            autocomplete="email"
            maxlength="150"
        >

        <label for="cadastroEmail">
            E-mail
        </label>

    </div>


    <!-- ==============================
         CÓDIGO DO VENDEDOR
         ============================== -->

    <div class="input-group">

        <input
            id="cadastroCodigoVendedor"
            type="text"
            maxlength="6"
            autocomplete="off"
        >

        <label for="cadastroCodigoVendedor">
            Código do vendedor
        </label>

    </div>


    <button
        type="button"
        id="btnFinalizarCadastro"
    >
        Finalizar cadastro
    </button>

</div>


        <div id="erroCadastro"></div>


        <button
            type="button"
            id="btnVoltarLogin"
        >
            ← Voltar para login
        </button>

    </div>

</div>


<!-- =========================================================
     LADO DIREITO
     ========================================================= -->

<div class="separador-login">
    <span>OU</span>
</div>


<div id="painelLogoQuatroK">

    <div class="logo-glow"></div>

    <img
        src="Imagens/Logo - Grupo 4k - Branco.png"
        alt="Grupo 4K"
        class="logo-grupo4k"
    >


</div>


<!-- =========================================================
     ACESSO POR CÓDIGO
     
     Mantemos no DOM para não quebrar o JS existente,
     mas ele fica oculto visualmente.
     ========================================================= -->

<div id="acessoCodigoVendedor">

    <h4>Acesso por código de vendedor</h4>

    <div class="input-group">

        <input
            id="codigoVendedorLogin"
            type="text"
            autocomplete="off"
        >

        <label for="codigoVendedorLogin">
            Código do vendedor
        </label>

    </div>

    <button
        id="btnAcessarCodigo"
        type="button"
    >
        Acessar por código
    </button>

    <div id="erroCodigoVendedor"></div>

</div>

    </section>

</div>


<script src="config.js"></script>

<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<script src="fonte_protheus.js"></script>
<script src="tela_login.js"></script>

</body>

</html>
